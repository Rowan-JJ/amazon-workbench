<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#EBE7E0"><title>Popilush</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="polish.css"><link rel="stylesheet" href="promotion.css"><link rel="stylesheet" href="demo.css"></head>
<body><a class="skip-link" href="#main">跳到主要内容</a><aside><a class="brand" href="#overview"><span class="brand-mark">P</span><div>精细化运营平台<small>POPILUSH</small></div></a><div class="workspace">PL-AMZ-US-PL <span>US</span></div><nav id="nav"></nav><div class="side-bottom"><button id="nav-explanations">ⓘ 数据解释</button><small>Popilush · 精细化运营</small><button id="demo-toggle" class="demo-toggle" aria-pressed="false" disabled><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="m6 5.5 4 2.5-4 2.5z"/></svg><span>演示模式</span></button></div></aside>
<div class="shell"><header><div><span class="eyebrow">POPILUSH / OPERATIONS</span><h1 id="page-title">经营总览</h1></div><div class="header-actions"><label class="date-label">分析日期<select id="date"></select></label><button id="open-explanations">数据解释</button><button class="primary" id="import-top">＋ 导入数据</button></div></header><div id="demo-banner" class="demo-banner" hidden role="status"><div><strong>演示模式</strong><span>当前为示例数据，可自由试用；退出即可恢复。</span></div><button id="exit-demo">退出演示</button></div><main id="main" tabindex="-1"></main><footer>精细化运营平台 / Popilush <span>USD · 美国站</span></footer></div>
<input id="files" type="file" accept=".xlsx" multiple hidden><input id="restore" type="file" accept=".json" hidden><dialog id="import-dialog"><div class="dialog-heading"><div><span class="eyebrow">IMPORT REVIEW</span><h2>确认本次导入</h2></div><button id="close-dialog" aria-label="关闭">×</button></div><div id="import-review"></div><div class="dialog-actions"><button id="cancel-import">取消</button><button class="primary" id="commit-import">确认并更新数据</button></div></dialog><div id="toast" role="status"></div>
<dialog id="delete-dialog"><div class="dialog-heading"><div><span class="eyebrow">MANAGE IMPORTS</span><h2>删除导入记录</h2></div><button id="close-delete" aria-label="关闭删除预览">×</button></div><div id="delete-review"></div><div class="dialog-actions"><button id="cancel-delete">取消</button><button class="delete-confirm" id="confirm-delete">确认删除</button></div></dialog>
<dialog id="explanation-drawer" aria-labelledby="explanation-title"><div class="dialog-heading"><h2 id="explanation-title">数据解释</h2><button id="close-explanations" aria-label="关闭数据解释">×</button></div><div id="explanation-content"></div></dialog>
<div id="busy-layer" hidden role="status" aria-live="polite"><div class="busy-card"><span class="busy-spinner" aria-hidden="true"></span><strong id="busy-label">正在读取报表…</strong><span>请稍候，完成后可预览确认</span></div></div>
<script src="vendor/jszip.min.js"></script><script type="module" src="app.js"></script></body></html>
