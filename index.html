<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123e35"><title>款观 · 亚马逊运营工作台</title><link rel="stylesheet" href="styles.css"></head>
<body><aside><a class="brand" href="#overview"><span class="brand-mark">款</span><div>款观<small>AMAZON WORKBENCH</small></div></a><div class="workspace">PL-AMZ-US-PL <span>US</span></div><nav id="nav"></nav><div class="side-bottom"><span class="online-dot"></span> 数据仅存于此浏览器<small>本地分析 · 无需账号</small></div></aside>
<div class="shell"><header><div><span class="eyebrow">YOUR EVERYDAY OPERATING DESK</span><h1 id="page-title">经营总览</h1></div><div class="header-actions"><label class="date-label">分析日期<select id="date"></select></label><button class="primary" id="import-top">＋ 导入数据</button></div></header><main id="main"></main><footer>款观 / 美国站女装运营工作台 <span>金额默认 USD · 日期按源文件名识别</span></footer></div>
